name: audit

on:
  workflow_dispatch:        # bouton "Run workflow" dans l'onglet Actions
    inputs:
      mode:
        description: "Que lancer"
        type: choice
        default: inspection_seule
        options:
          - inspection_seule
          - inspection_puis_audit
      step_min:
        description: "Pas de la grille en minutes"
        default: "15"
  schedule:
    - cron: "0 5 * * 1"     # tous les lundis à 5 h UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        # Ajout de huggingface_hub ici
        run: pip install duckdb pyarrow pandas tabulate huggingface_hub

      - name: Télécharger les données depuis Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATASET: ${{ vars.HF_DATASET }}
        run: |
          # Télécharge tout le contenu du dataset HF dans un dossier local nommé "raw_data"
          huggingface-cli download "$DATASET" --repo-type dataset --local-dir ./raw_data --token "$HF_TOKEN"

      - name: Inspecter le schéma
        run: |
          {
            echo "## Inspection du schéma"
            echo '```'
            # On pointe maintenant vers le dossier local au lieu de s3://
            python inspecte.py "./raw_data/status/**/*.parquet" 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lancer l'audit
        if: inputs.mode != 'inspection_seule' || github.event_name == 'schedule' 
        run: |
          # On pointe également vers les dossiers locaux téléchargés
          python audit_velib.py \
            --status "./raw_data/status/**/*.parquet" \
            --info   "./raw_data/information/**/*.parquet" \
            --step-min "${{ inputs.step_min || 15 }}" \
            --out audit_report.md

      - name: Publier le rapport dans le résumé du run
        if: always()
        run: |
          # Vérifie que le fichier a bien été créé avant de l'afficher (utile si l'étape précédente plante)
          if [ -f audit_report.md ]; then
            cat audit_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Conserver le rapport en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_number }}
          path: audit_report.md
          retention-days: 90
